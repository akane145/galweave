<!DOCTYPE html>
<html lang="zh-CN" data-theme="dark">
<head>
<meta charset="utf-8">
<title>P1-1 翻译工作区 · 状态检查页</title>
<!-- 直接引用真实样式表，结构与 src/renderer.js buildRow() 一致 -->
<link rel="stylesheet" href="../src/style.css">
<style>
  html,body{ height:100%; margin:0 }
  body{ display:flex; flex-direction:column; background:var(--bg-void) }
  /* 检查页自身的说明条，不参与被测样式 */
  .chk-note{
    flex:none; padding:12px 20px; border-bottom:1px solid var(--border-hair);
    background:var(--bg-panel); color:var(--text-mid);
    font-family:var(--font-ui); font-size:var(--fs-sm); line-height:1.7;
  }
  .chk-note b{ color:var(--text-hi) }
  .chk-note code{ font-family:var(--font-mono); color:var(--accent); font-size:var(--fs-xs) }
  .chk-note .keys{ color:var(--text-dim); font-size:var(--fs-2xs) }
  #stage{ flex:1 1 auto; min-height:0 }
  /* 状态说明写在 .pid 位（真实运行时这里是段落 ID） */
  .num .pid{ font-family:var(--font-ui) !important; letter-spacing:.02em }
</style>
</head>
<body>

<div class="chk-note">
  <b>P1-1 翻译工作区状态检查页</b> — 样式直接引用 <code>src/style.css</code>，DOM 结构与 <code>renderer.js:buildRow()</code> 一致。<br>
  <span class="keys">鼠标悬停任意行看 hover；点击译文框看 focus（第 2 行默认已 focus）。每行 <code>.pid</code> 位显示该行的状态组合。</span>
</div>

<div id="stage">
  <div id="list"></div>
</div>

<script>
// 模拟 main.js applyFonts 的注入（theme.js 默认 17px）
document.documentElement.style.setProperty('--orig-font-size', '17px');
document.documentElement.style.setProperty('--trans-font-size', '17px');

const ROWS = [
  { cls:'',                       pid:'① 普通未翻译行',              name:'結衣', orig:'「ねえ、聞いてる？　わたし、今日ね、ずっと探してたんだ。」',                         trans:'' },
  { cls:'active',                 pid:'② 当前行 · 五层高亮',          name:'結衣', orig:'「だから——見つけたとき、ほんとに、うれしくて。」',                                   trans:'所以——找到的那一刻，我是真的、真的很开心。', focus:true },
  { cls:'done',                   pid:'③ 已完成 · 行号✓ + 青绿底边',   name:'',     orig:'「……わたしのこと、待っててくれた？」',                                             trans:'……你一直在等我吗？' },
  { cls:'done active',            pid:'④ 已完成 + 当前行',            name:'瞬',   orig:'「ああ。ずっとここで、待ってた。」',                                               trans:'嗯。我一直在这里，等着你。' },
  { cls:'pr-on pr-pending',       pid:'⑤ 校对·待确认（灰条）',         name:'結衣', orig:'「うれしい。わたし、すごく——」',                                                 trans:'好开心。我真的、非常——' },
  { cls:'pr-on pr-issue',         pid:'⑥ 校对·有问题（琥珀条）',       name:'結衣', orig:'「……なんでもない。忘れて。」',                                                   trans:'……没什么。当我没说。' },
  { cls:'pr-on pr-issue active',  pid:'⑦ 有问题 + 当前行 ← 原 bug',    name:'瞬',   orig:'「そんな顔をするなよ。心配させるな。」',                                           trans:'别摆出那副表情。别让我担心。' },
  { cls:'pr-on pr-approved',      pid:'⑧ 校对·已定稿（青绿条）',        name:'結衣', orig:'「……ごめん。ちょっと、思い出しちゃって。」',                                       trans:'……抱歉。我忽然想起了一些事。' },
  { cls:'pr-on pr-missing',       pid:'⑨ 校对·漏翻（红橙条）',          name:'モブ', orig:'「それで、二人は並んで歩いていった。」',                                         trans:'' },
  { cls:'has-match',              pid:'⑩ 搜索命中',                    name:'結衣', orig:'「ずっと、ずっと一緒にいてね。」',                                                 trans:'要一直、一直和我在一起哦。' },
  { cls:'match-current',          pid:'⑪ 当前搜索命中',                name:'瞬',   orig:'「ああ、約束する。」',                                                           trans:'嗯，我答应你。' },
  { cls:'',                       pid:'⑫ 只读行（锁定）',              name:'',     orig:'——そして、夏が終わった。',                                                       trans:'——于是，夏天结束了。', readonly:true },
];

const list = document.getElementById('list');
for (let i = 0; i < ROWS.length; i++) {
  const r = ROWS[i];
  const row = document.createElement('div');
  row.className = 'para' + (r.cls ? ' ' + r.cls : '');
  row.id = 'para-' + i;
  row.setAttribute('role', 'listitem');

  const num = document.createElement('div');
  num.className = 'num';
  num.appendChild(document.createTextNode(String(i + 1)));
  const pid = document.createElement('span');
  pid.className = 'pid';
  pid.textContent = r.pid;
  num.appendChild(pid);

  const origCell = document.createElement('div');
  origCell.className = 'orig-cell';
  const oc = document.createElement('span');
  oc.className = 'dialogue-caption orig-caption';
  oc.textContent = 'ORIGINAL';
  const origName = document.createElement('div');
  origName.className = 'orig-name' + (r.name ? '' : ' empty');
  origName.textContent = r.name || '（无说话人）';
  const orig = document.createElement('div');
  orig.className = 'orig';
  orig.textContent = r.orig;
  origCell.append(oc, origName, orig);

  const tb = document.createElement('section');
  tb.className = 'translation-block';
  const tc = document.createElement('span');
  tc.className = 'dialogue-caption trans-caption';
  tc.textContent = 'TRANSLATION';
  const sp = document.createElement('div');
  sp.className = 'speaker-plate';
  const ni = document.createElement('input');
  ni.className = 'pname-input';
  ni.type = 'text';
  ni.placeholder = '译名';
  sp.append(ni);
  const inputRow = document.createElement('div');
  inputRow.className = 'row-input';
  const ta = document.createElement('textarea');
  ta.className = 'trans';
  ta.rows = 1;
  ta.placeholder = '在此输入译文…';
  ta.value = r.trans || '';
  if (r.readonly) { ta.readOnly = true; }
  const cb = document.createElement('button');
  cb.className = 'copy-btn';
  cb.textContent = '复制原文';
  inputRow.append(ta, cb);
  tb.append(tc, sp, inputRow);

  const body = document.createElement('div');
  body.className = 'body';
  const proofRow = document.createElement('div');
  proofRow.className = 'proof-row';
  if (r.cls.includes('pr-on')) {
    const b = document.createElement('button');
    b.textContent = '✓ 通过';
    const b2 = document.createElement('button');
    b2.textContent = '⚠ 有问题';
    proofRow.append(b, b2);
  }
  body.append(origCell, tb, proofRow);
  row.append(num, body);
  list.appendChild(row);

  if (r.focus) { setTimeout(() => ta.focus(), 50); }
}
</script>
</body>
</html>
